services:
  postgres:
    image: postgres:16-alpine
    container_name: pomelo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pomelo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-pomelo_planning}
    ports:
      - '5432:5432'
    volumes:
      - pomelo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pomelo}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pomelo_pgdata:
